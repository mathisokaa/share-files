<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Share Files</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 60px auto; padding: 0 20px; color: #222; }
  h1 { font-size: 1.4rem; }
  form { border: 1px solid #ddd; border-radius: 8px; padding: 24px; }
  label { display: block; margin-bottom: 8px; font-weight: 600; }
  input[type="file"] { margin-bottom: 16px; }
  select { margin-bottom: 16px; padding: 6px; }
  button { background: #222; color: #fff; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: default; }
  #result { margin-top: 20px; padding: 16px; background: #f5f5f5; border-radius: 8px; display: none; }
  code { word-break: break-all; display: block; background: #fff; padding: 8px; border-radius: 4px; margin-top: 8px; }
  .error { color: #b00020; margin-top: 12px; }
</style>
</head>
<body>
<h1>Déposer un fichier</h1>
<form id="upload-form">
  <label for="file">Fichier</label>
  <input type="file" id="file" name="file" required>

  <label for="ttl">Durée de validité du lien</label>
  <select id="ttl" name="ttlHours">
    <option value="1">1 heure</option>
    <option value="24" selected>24 heures</option>
    <option value="72">3 jours</option>
    <option value="168">7 jours</option>
  </select>

  <button type="submit">Envoyer</button>
</form>

<div id="result"></div>
<div id="error" class="error"></div>

<script>
const form = document.getElementById('upload-form');
const result = document.getElementById('result');
const errorBox = document.getElementById('error');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorBox.textContent = '';
  result.style.display = 'none';

  const fileInput = document.getElementById('file');
  const ttl = document.getElementById('ttl').value;
  const submitBtn = form.querySelector('button');

  if (!fileInput.files.length) return;

  const formData = new FormData();
  formData.append('file', fileInput.files[0]);
  formData.append('ttlHours', ttl);

  submitBtn.disabled = true;
  submitBtn.textContent = 'Envoi...';

  try {
    const res = await fetch('/upload', { method: 'POST', body: formData });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Erreur lors de l\'envoi.');

    result.style.display = 'block';
    result.innerHTML = `
      <p>Lien de téléchargement (expire le ${new Date(data.expiresAt).toLocaleString('fr-FR')}) :</p>
      <code>${data.url}</code>
      <p>Commande curl pour un agent IA :</p>
      <code>${data.curl}</code>
    `;
  } catch (err) {
    errorBox.textContent = err.message;
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Envoyer';
  }
});
</script>
</body>
</html>
